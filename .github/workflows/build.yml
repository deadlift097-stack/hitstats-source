name: Build HitStats jar
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK parts
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
      - name: Build
        run: |
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          API=$(find "$GITHUB_WORKSPACE" -type f -iname '*modhost*api*.jar' | head -n 1)
          if [ -z "$API" ]; then
            echo "ERROR: modhost-api.jar is not in the repo. Upload it to the repo root and run again."
            find "$GITHUB_WORKSPACE" -type f -not -path '*/.git/*'
            exit 1
          fi
          echo "Using API jar: $API"
          chmod +x build.sh
          ./build.sh "$API" "$ANDROID_HOME/platforms/android-34/android.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: hitstats-jar
          path: hitstats.jar
